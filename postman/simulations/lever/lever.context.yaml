purpose:
  stands_in_for: Lever Postings API global/EU public posting reads and authenticated submissions, using only synthetic
    fixture jobs.
  unblocks: Local real-HTTP testing of Career Finder's submission ledger and receipt handling without submitting
    to employers.
assumptions:
- id: documented-acceptance-receipt
  status: supported
  claim: Lever documents HTTP 200 with ok true and a string applicationId as a successful application response.
  reason: The provider's current official Postings API documentation describes that response explicitly.
  verification: Read the official provider README on 2026-11-16. No live submission was made; runtime compatibility
    remains unverified.
  source: https://github.com/lever/postings-api#apply-to-a-job-posting
  updated_at: '2026-11-16'
- id: employer-key-and-fields
  status: supported
  claim: Automatic submission needs an employer-authorized key and employer-reviewed required fields, including
    custom-question limitations.
  reason: The official provider documentation requires a key generated by an account administrator and does not
    expose custom questions through this API.
  verification: Read official README on 2026-11-16. No credential was requested or used.
  source: https://github.com/lever/postings-api#apply-to-a-job-posting
  updated_at: '2026-11-16'
- id: timeout-acceptance
  status: unknown
  claim: A timed-out submission may already have created an application at Lever.
  reason: The public contract does not establish idempotent application retry behavior after ambiguous failures.
    The local model records a POST before delaying its response.
  verification: The handler models a two-second delayed receipt; behavior of the real provider after timeout has
    not been observed.
  source: postman/mocks/lever/default.js
  updated_at: '2026-11-16'
- id: modeled-failure-responses
  status: unknown
  claim: The simulated 503, missing receipt, redirect and delay represent defensive failure cases, not verified
    live provider responses.
  reason: These scenarios test conservative client behavior outside the documented success contract; their occurrence
    at the real provider is not asserted.
  verification: The missing-receipt case ran through the actual application on 2026-11-16; the other defensive scenarios were not exercised by this collection. Live provider behavior remains unverified.
  source: postman/mocks/lever/default.js
  updated_at: '2026-11-16'
- id: mocked-app-behavior
  status: supported
  claim: In the two synthetic application outcomes executed, Career Finder confirmed the valid provider receipt,
    preserved a missing-receipt outcome as uncertain, and sent only one POST per application despite sequential
    submit replays.
  reason: The actual companion ran against the local Postman simulation; collection assertions and independent mock
    dispatch observations agreed.
  verification: On 2026-11-16 at 13:02 UTC, Postman CLI 1.90.0 ran 28 HTTP requests with 36 passing assertions,
    zero failed assertions and exit 0. Two provider POSTs were observed, one per application. Actual multipart PDF
    bytes were observed. This does not establish live Lever compatibility or concurrent-click behavior.
  source: postman/verification.json; postman/collections/verified-applications; Mac run career-postman-run-ImdXzj
  updated_at: '2026-11-16'
