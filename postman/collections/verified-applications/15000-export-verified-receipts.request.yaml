$kind: http-request
name: Export verified receipts
order: 15000
url: '{{baseUrl}}/api/apply/receipts'
method: GET
headers:
  Content-Type: application/json
  Origin: '{{baseUrl}}'
  X-Career-CSRF: '{{csrfToken}}'
  Cookie: '{{sessionCookie}}'
settings:
  followRedirects: false
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const text=pm.response.text();
    pm.test('Receipt export is available',()=>pm.response.to.have.status(200));
    pm.test('Export contains provider evidence',()=>pm.expect(text).to.include('test-application-'));
    pm.test('Export excludes keys and CV bytes',()=>{pm.expect(text).not.to.include('fixture-key-never-real');pm.expect(text).not.to.include('dataBase64');});
