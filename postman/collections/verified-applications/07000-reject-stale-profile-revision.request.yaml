$kind: http-request
name: Reject stale profile revision
order: 7000
url: '{{baseUrl}}/api/apply/profile'
method: PUT
headers:
  Content-Type: application/json
  Origin: '{{baseUrl}}'
  X-Career-CSRF: '{{csrfToken}}'
  Cookie: '{{sessionCookie}}'
settings:
  followRedirects: false
body:
  type: json
  content: |-
    {
      "expectedRevision": 0,
      "profile": {
        "firstName": "Integration",
        "lastName": "Fixture",
        "email": "fixture+{{runId}}@example.com",
        "phone": "+966500000000",
        "city": "Riyadh",
        "country": "SA",
        "headline": "Synthetic test applicant",
        "skills": [
          "JavaScript",
          "API testing"
        ],
        "targetRoles": [
          "Software Developer"
        ],
        "targetCountries": [
          "SA",
          "NZ"
        ],
        "workModes": [
          "hybrid",
          "remote"
        ],
        "experienceLevel": "entry",
        "website": "https://example.com/fixture"
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('Stale write is rejected',()=>pm.response.to.have.status(409));
