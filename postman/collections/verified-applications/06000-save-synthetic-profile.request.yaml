$kind: http-request
name: Save synthetic profile
order: 6000
url: '{{baseUrl}}/api/apply/profile'
method: PUT
headers:
  Content-Type: application/json
  Origin: '{{baseUrl}}'
  X-Career-CSRF: '{{csrfToken}}'
  Cookie: '{{sessionCookie}}'
settings:
  followRedirects: false
body:
  type: json
  content: |-
    {
      "expectedRevision": 0,
      "profile": {
        "firstName": "Integration",
        "lastName": "Fixture",
        "email": "fixture+{{runId}}@example.com",
        "phone": "+966500000000",
        "city": "Riyadh",
        "country": "SA",
        "headline": "Synthetic test applicant",
        "skills": [
          "JavaScript",
          "API testing"
        ],
        "targetRoles": [
          "Software Developer"
        ],
        "targetCountries": [
          "SA",
          "NZ"
        ],
        "workModes": [
          "hybrid",
          "remote"
        ],
        "experienceLevel": "entry",
        "website": "https://example.com/fixture",
        "resume": {
          "name": "integration-resume.pdf",
          "mime": "application/pdf",
          "dataBase64": ""
        }
      }
    }
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    const d=pm.response.json();
    pm.test('Profile and resume metadata saved',()=>{pm.response.to.have.status(200);pm.expect(d.ok).to.eql(true);pm.expect(d.profile.revision).to.eql(1);pm.expect(d.profile.resume).to.be.an('object');});
    pm.test('CV bytes are not returned',()=>pm.expect(pm.response.text()).not.to.include('dataBase64'));
