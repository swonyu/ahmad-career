name: Phone quality

on:
  push:
    branches:
      - main
      - 'career-finder-phones-verified-apply-*'
    paths:
      - '.github/workflows/phone-quality.yml'
      - 'website/**'
      - 'hosted/**'
      - 'postman/**'
      - 'android/**'
      - 'apple/**'
  pull_request:
    paths:
      - '.github/workflows/phone-quality.yml'
      - 'website/**'
      - 'hosted/**'
      - 'postman/**'
      - 'android/**'
      - 'apple/**'
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: Full release checks or one focused Android or iPhone run
        required: true
        default: full
        type: choice
        options:
          - full
          - android
          - android-picker
          - android-connected-picker
          - iphone-connection
          - iphone-regressions
          - iphone-saved-actions
          - iphone-search-history
          - iphone-arabic-profile
          - iphone-ui
          - iphone-release-build
          - iphone-local-files
          - iphone-documents-en
          - iphone-documents-ar

permissions:
  contents: read

concurrency:
  group: phone-quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs.acceptance_scope || 'release' }}
  cancel-in-progress: true

jobs:
  service:
    name: Service and synthetic HTTPS
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.acceptance_scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse --verify HEAD)
          printf 'Expected source commit: %s\nChecked out source commit: %s\n' "$GITHUB_SHA" "$actual_sha"
          test "$actual_sha" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned companion dependencies
        working-directory: website
        run: npm ci
      - name: Existing record and discovery regressions
        working-directory: website
        run: npm test
      - name: Verified-submission state and HTTP regressions
        working-directory: website
        run: npm run test:applications
      - name: Synthetic TLS, consent, receipts and recovery
        run: node website/applications/fixtures/tls-check.mjs

  hosted:
    name: Hosted HTTPS service and durable storage
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.acceptance_scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse --verify HEAD)
          printf 'Expected source commit: %s\nChecked out source commit: %s\n' "$GITHUB_SHA" "$actual_sha"
          test "$actual_sha" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned hosted service dependencies
        working-directory: hosted
        run: npm ci
      - name: Check account screens and worker types
        working-directory: hosted
        run: |
          npm run typecheck
          npm run lint
      - name: Exercise the production handler with real local D1 and R2
        working-directory: hosted
        run: |
          npm test
          node tests/hosted-worker.mjs
          node --test tests/browser-api.mjs tests/browser-pairing.mjs
      - name: Build the deployable Worker and phone setup pages
        working-directory: hosted
        run: |
          npm run build
          npm run test:ssr
      - name: Audit the locked dependencies
        working-directory: hosted
        timeout-minutes: 3
        run: npm audit --json --fetch-retries=0 --fetch-timeout=30000 > tests/dependency-audit-ci.json
      - name: Keep the hosted regression evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-storage-checks-${{ github.run_id }}
          path: |
            hosted/tests/hosted-verification.json
            hosted/tests/hosted-worker-verification.json
            hosted/tests/hosted-discovery-verification.json
            hosted/tests/hosted-phone-verification.json
            hosted/tests/dependency-audit-ci.json
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: ${{ inputs.acceptance_scope == 'android-picker' && 'PARTIAL Android PDF picker' || inputs.acceptance_scope == 'android-connected-picker' && 'Android native acceptance with real Files import' || 'Android compile, lint and native acceptance' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.acceptance_scope == 'full' || startsWith(inputs.acceptance_scope, 'android') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAREER_ANDROID_ACCEPTANCE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse --verify HEAD)
          printf 'Expected source commit: %s\nChecked out source commit: %s\n' "$GITHUB_SHA" "$actual_sha"
          test "$actual_sha" = "$GITHUB_SHA"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
          overwrite-settings: false
      - name: Require the pinned Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Phone URL, PDF and receipt policies
        if: ${{ env.CAREER_ANDROID_ACCEPTANCE_SCOPE != 'android-picker' }}
        run: bash android/checks/run-policy-checks.sh
      - name: Compile the ordinary preview and its instrumentation
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          tasks=(:app:assembleDebug :app:assembleDebugAndroidTest)
          if [ "$CAREER_ANDROID_ACCEPTANCE_SCOPE" != android-picker ]; then tasks+=(:app:lintDebug); fi
          if [ "$CAREER_ANDROID_ACCEPTANCE_SCOPE" = android-connected-picker ]; then tasks+=(:app:bundleRelease); fi
          for attempt in 1 2; do
            log="$RUNNER_TEMP/career-android-build-$attempt.log"
            if ./gradlew --no-daemon --max-workers=2 "${tasks[@]}" 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && grep -Eq 'Received status code 429 from server: Too Many Requests' "$log" && ! grep -Eq '^e: |Compilation error|There were failing tests|Lint found errors' "$log"; then
              echo 'Dependency provider requested a cooldown. Waiting two minutes before one bounded retry.'
              sleep 120
            else
              exit 1
            fi
          done
      - name: Record the unsigned Android release bundle
        if: ${{ env.CAREER_ANDROID_ACCEPTANCE_SCOPE == 'android-connected-picker' }}
        shell: bash
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          unzip -tq "$bundle"
          sha256sum "$bundle" | tee "$RUNNER_TEMP/career-android-release.sha256"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the disposable phone emulator and synthetic companion
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'system-images;android-36;google_apis;x86_64'
          if [ "$CAREER_ANDROID_ACCEPTANCE_SCOPE" != android-picker ]; then npm ci --prefix website; fi
      - name: Exercise actual phone, storage, large text, RTL and synthetic HTTPS flows
        run: node android/checks/run-ci-emulator.mjs
      - name: Keep Android test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.acceptance_scope == 'android-picker' && format('android-picker-{0}', github.run_id) || format('android-lint-{0}', github.run_id) }}
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/outputs/bundle/release/app-release.aab
            android/checks/ci-evidence/**
            ${{ runner.temp }}/career-android-release.sha256
            ${{ runner.temp }}/career-android-build-*.log
          if-no-files-found: ignore
          retention-days: 7

  iphone-policy:
    name: iPhone logic and unsigned build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.acceptance_scope == 'full' || inputs.acceptance_scope == 'iphone-release-build' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CAREER_IPHONE_ARCHIVE: ${{ inputs.acceptance_scope == 'iphone-release-build' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse --verify HEAD)
          printf 'Expected source commit: %s\nChecked out source commit: %s\n' "$GITHUB_SHA" "$actual_sha"
          test "$actual_sha" = "$GITHUB_SHA"
      - name: Execute the production client and store checks
        run: bash apple/Checks/check-mobile.sh
      - name: Build the production iPhone configuration on this isolated runner
        shell: bash
        run: |
          set -o pipefail
          action="build"
          archive=()
          if [[ "$CAREER_IPHONE_ARCHIVE" == true ]]; then
            action="archive"
            archive=(-archivePath "$RUNNER_TEMP/CareerFinder.xcarchive")
          fi
          xcodebuild -project apple/AhmadCareer.xcodeproj -scheme AhmadCareer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/career-iphone-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            "${archive[@]}" "$action" 2>&1 | tee "$RUNNER_TEMP/career-iphone-build.log"
      - name: Verify the built iPhone product and privacy manifest
        shell: python
        run: |
          import os, pathlib, plistlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          if os.environ['CAREER_IPHONE_ARCHIVE'] == 'true':
              product = temp / 'CareerFinder.xcarchive/Products/Applications/Career Finder.app'
          else:
              product = temp / 'career-iphone-derived-data/Build/Products/Release-iphoneos/Career Finder.app'
          with (product / 'Info.plist').open('rb') as source:
              info = plistlib.load(source)
          assert info['UIDeviceFamily'] == [1], info.get('UIDeviceFamily')
          assert info['CFBundleIdentifier'] == 'com.ahmadalayed.career', info.get('CFBundleIdentifier')
          assert info['CFBundleDisplayName'] == 'Career Finder', info.get('CFBundleDisplayName')
          assert info['CFBundleName'] == 'Career Finder', info.get('CFBundleName')
          assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS'], info.get('CFBundleSupportedPlatforms')
          assert (product / info['CFBundleExecutable']).is_file()
          with (product / 'PrivacyInfo.xcprivacy').open('rb') as source:
              privacy = plistlib.load(source)
          disk_space = 'NSPrivacyAccessedAPICategoryDiskSpace'
          reasons = {entry['NSPrivacyAccessedAPIType']: entry['NSPrivacyAccessedAPITypeReasons']
                     for entry in privacy['NSPrivacyAccessedAPITypes']}
          assert 'E174.1' in reasons.get(disk_space, []), 'Recovery export disk-space reason missing from privacy manifest'
          print('Built an unsigned iPhone-only product with the preserved app identity and recovery export privacy declaration.')
      - name: Package the unsigned iPhone archive
        if: ${{ env.CAREER_IPHONE_ARCHIVE == 'true' }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --keepParent CareerFinder.xcarchive CareerFinder.xcarchive.zip
          unzip -tq CareerFinder.xcarchive.zip
          shasum -a 256 CareerFinder.xcarchive.zip > career-iphone-release.sha256
      - name: Keep the unsigned build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: iphone-build-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/career-iphone-build.log
            ${{ runner.temp }}/CareerFinder.xcarchive.zip
            ${{ runner.temp }}/career-iphone-release.sha256
          if-no-files-found: ignore
          retention-days: 7

  iphone-ui:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'iphone-connection' && 'PARTIAL iPhone connection regression' || inputs.acceptance_scope == 'iphone-regressions' && 'PARTIAL iPhone history and keyboard regressions' || inputs.acceptance_scope == 'iphone-saved-actions' && 'PARTIAL iPhone Saved actions' || inputs.acceptance_scope == 'iphone-search-history' && 'PARTIAL iPhone search history' || inputs.acceptance_scope == 'iphone-arabic-profile' && 'PARTIAL iPhone Arabic profile' || inputs.acceptance_scope == 'iphone-ui' && 'PARTIAL iPhone UI acceptance' || inputs.acceptance_scope == 'iphone-local-files' && 'PARTIAL iPhone offline Files import and restart' || startsWith(inputs.acceptance_scope, 'iphone-documents-') && format('PARTIAL iPhone document picker ({0})', inputs.acceptance_scope) || 'iPhone native interface acceptance' }}
    if: ${{ github.event_name != 'workflow_dispatch' || (!startsWith(inputs.acceptance_scope, 'android') && inputs.acceptance_scope != 'iphone-release-build') }}
    runs-on: macos-26
    # Allow the sequential suite to finish, with time left to export the result bundle.
    timeout-minutes: 125
    env:
      CAREER_UI_ACCEPTANCE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse --verify HEAD)
          printf 'Expected source commit: %s\nChecked out source commit: %s\n' "$GITHUB_SHA" "$actual_sha"
          test "$actual_sha" = "$GITHUB_SHA"
      - name: Verify sanitized lifecycle collection fixtures
        run: python3 apple/Checks/test-browser-lifecycle-collection.py
      - name: Verify fresh simulator selection fixtures
        run: python3 apple/Checks/test-simulator-selection.py
      - name: Create a fresh iPhone on this disposable hosted runner
        shell: python
        run: |
          import json, os, pathlib, platform, re, subprocess
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          candidates = []
          for runtime, devices in inventory['devices'].items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'\d+', runtime.split('.iOS-', 1)[1])))
              if not version or version[0] < 17:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      compact = not any(word in device['name'] for word in ['Max', 'Plus'])
                      device_type = device.get('deviceTypeIdentifier')
                      # Alphabetical names put Air before numbered models. Prefer a regular-size
                      # numbered Pro/standard iPhone within the newest supported runtime instead.
                      # Fresh 17 Pro/iOS 26.5 passed strict boot in retained recovery evidence;
                      # a fresh Air on that runtime failed migration. Model causation is unproven.
                      numbered = re.fullmatch(r'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-(\d+)(-Pro)?', device_type or '')
                      hardware_rank = (bool(numbered), int(numbered[1]) if numbered else 0, bool(numbered and numbered[2]))
                      candidates.append((version, compact, hardware_rank, device['name'], device['udid'], runtime, device_type))
          assert candidates, 'This runner has no available iPhone Simulator with iOS 17 or later (the UI-test target minimum).'
          version, compact, hardware_rank, name, source_identifier, runtime, device_type = sorted(candidates, reverse=True)[0]
          uuid = r'[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}'
          assert re.fullmatch(uuid, source_identifier), source_identifier
          assert isinstance(device_type, str) and device_type.startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-'), device_type
          architecture = platform.machine()
          assert architecture in {'arm64', 'x86_64'}, architecture
          # Use the verified type/runtime, without inheriting the runner image's device data.
          fresh_name = 'CareerFinder-CI-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          identifier = subprocess.check_output(['xcrun', 'simctl', 'create', fresh_name, device_type, runtime], text=True).strip()
          assert re.fullmatch(uuid, identifier), 'simctl create did not return one valid device UUID.'
          prior_identifiers = {device['udid'].upper() for devices in inventory['devices'].values() for device in devices}
          assert identifier.upper() not in prior_identifiers, 'simctl create returned an existing device.'
          created_inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          matches = [{'runtime': key, **device} for key, devices in created_inventory['devices'].items()
                     for device in devices if device['udid'].upper() == identifier.upper()]
          assert len(matches) == 1, 'The newly created device must occur exactly once in the available inventory.'
          created = matches[0]
          assert (created['runtime'], created.get('deviceTypeIdentifier'), created['name']) == (runtime, device_type, fresh_name), created
          assert created.get('isAvailable') is True and not created.get('availabilityError') and created.get('state') == 'Shutdown', created
          receipt = {
              'schemaVersion': 1, 'runID': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'checkoutSHA': os.environ['GITHUB_SHA'], 'architecture': architecture,
              'sourceDevice': {'udid': source_identifier, 'name': name, 'runtime': runtime, 'deviceTypeIdentifier': device_type},
              'createdDevice': {key: created.get(key) for key in ('udid', 'name', 'runtime', 'deviceTypeIdentifier', 'state', 'isAvailable')},
              'scope': 'Fresh device selection only; boot readiness and all native journeys remain separate required gates.',
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'career-iphone-selection.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CAREER_UI_DEVICE=' + identifier + '\n')
              output.write('CAREER_UI_ARCH=' + architecture + '\n')
          print('Selected', name, 'on iOS', '.'.join(map(str, version)), 'architecture', architecture)
          print('Created fresh CI device', fresh_name, identifier, 'using', device_type, runtime)
      - name: Verify simulator boot evidence parser fixtures
        run: python3 apple/Checks/test-simulator-boot.py
      - name: Configure software keyboard preference for the owned CI iPhone
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 apple/Checks/configure-simulator-input.py \
            --selection "$RUNNER_TEMP/career-iphone-selection.json" \
            --device "$CAREER_UI_DEVICE" \
            --output "$RUNNER_TEMP/career-iphone-input-configuration.json"
      - name: Boot selected iPhone and wait for readiness
        shell: bash
        # Strict readiness took 187s in run 44368339432, including UUID inventory.
        timeout-minutes: 5
        run: |
          set -o pipefail
          boot_results=(0 0)
          xcrun simctl bootstatus "$CAREER_UI_DEVICE" -b 2>&1 | tee "$RUNNER_TEMP/career-iphone-boot.log" || boot_results=("${PIPESTATUS[@]}")
          inventory_result=0
          printf 'Boot command exited %s; collecting inventory for selected device %s\n' "${boot_results[0]}" "$CAREER_UI_DEVICE"
          # The all-device listing took about 80s after Finished in run 44326554344.
          # Scope this read to the owned UUID; the strict verifier still requires exactly one match.
          xcrun simctl list devices "$CAREER_UI_DEVICE" --json > "$RUNNER_TEMP/career-iphone-boot-devices.json" 2> "$RUNNER_TEMP/career-iphone-boot-devices.stderr" || inventory_result=$?
          printf 'Selected-device inventory exited %s; verifying retained boot evidence\n' "$inventory_result"
          python3 apple/Checks/verify-simulator-boot.py \
            --device "$CAREER_UI_DEVICE" \
            --boot-log "$RUNNER_TEMP/career-iphone-boot.log" \
            --inventory "$RUNNER_TEMP/career-iphone-boot-devices.json" \
            --boot-exit "${boot_results[0]}" --log-exit "${boot_results[1]}" \
            --inventory-exit "$inventory_result" \
            --output "$RUNNER_TEMP/career-iphone-boot-verification.json"
      - name: Prepare Node for the document-picker fixture
        if: startsWith(env.CAREER_UI_ACCEPTANCE_SCOPE, 'iphone-documents-')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the isolated document-picker fixture dependencies
        if: startsWith(env.CAREER_UI_ACCEPTANCE_SCOPE, 'iphone-documents-')
        working-directory: hosted
        run: npm run install:ci
      - name: Exercise the actual iPhone document picker and recovery workflow
        if: startsWith(env.CAREER_UI_ACCEPTANCE_SCOPE, 'iphone-documents-')
        shell: bash
        timeout-minutes: 46
        run: python3 apple/Checks/run-ci-document-journey.py "${CAREER_UI_ACCEPTANCE_SCOPE##*-}"
      - name: Exercise native phone flows with isolated synthetic data
        if: ${{ !startsWith(env.CAREER_UI_ACCEPTANCE_SCOPE, 'iphone-documents-') }}
        shell: bash
        timeout-minutes: 110
        run: |
          set -o pipefail
          cases=()
          selection=()
          settings=()
          action="test"
          case "$CAREER_UI_ACCEPTANCE_SCOPE" in
            full) ;;
            iphone-ui)
              echo 'PARTIAL CI scope: all default iPhone UI tests.'
              ;;
            iphone-connection)
              cases=(CareerFinderUITests/testProfileReadinessAndSimpleConnectionSetup)
              echo 'PARTIAL regression: this one journey cannot establish the full release gate.'
              ;;
            iphone-regressions)
              cases=(CareerFinderApplicationHistoryUITests/testEnglishApplicationHistoryAcceptance
                CareerFinderApplicationHistoryUITests/testArabicApplicationHistoryAcceptance
                CareerFinderSearchHistoryUITests/testArabicSearchHistoryAcceptance
                CareerFinderSearchHistoryUITests/testEnglishSearchHistoryAcceptance
                CareerFinderUITests/testDiscoverySaveFlowsIntoSavedAndApply
                CareerFinderUITests/testPrivateApplicationRecordPersistsAndCorrectionIsExplicit
                CareerFinderUITests/testSavedSearchFindsArabicNotesAndKeepsOriginalText)
              ;;
            iphone-saved-actions)
              cases=(CareerFinderSavedComparisonAfterUITests/testAfterArabic
                CareerFinderSavedComparisonAfterUITests/testSavedOpeningSharesPublicDetailsAndCanCancel)
              ;;
            iphone-search-history)
              cases=(CareerFinderSearchHistoryUITests/testArabicSearchHistoryAcceptance
                CareerFinderSearchHistoryUITests/testEnglishSearchHistoryAcceptance)
              ;;
            iphone-arabic-profile)
              cases=(CareerFinderUITests/testArabicLanguagePersistsAndKeepsSavedProfileValuesAtLargeText)
              ;;
            iphone-local-files)
              cases=(CareerFinderUITests/testLocalFilesCVReplacementSurvivesRelaunch)
              settings=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) DEBUG CAREER_LOCAL_FILES_SMOKE CAREER_UI_PICKER_COPY_SMOKE")
              action="test-without-building"
              ;;
            *) echo 'Unsupported acceptance scope'; exit 1 ;;
          esac
          if (( ${#cases[@]} )); then
            printf '%s\n' "${cases[@]}" > "$RUNNER_TEMP/career-expected-ui-cases"
            for chosen in "${cases[@]}"; do selection+=("-only-testing:CareerFinderUITests/$chosen"); done
          fi
          build=(xcodebuild -project apple/AhmadCareer.xcodeproj -scheme CareerFinderAcceptance
            -configuration Debug -destination "platform=iOS Simulator,id=$CAREER_UI_DEVICE,arch=$CAREER_UI_ARCH" \
            -derivedDataPath "$RUNNER_TEMP/career-ui-derived" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            "${settings[@]}")
          if [[ "$action" == test-without-building ]]; then
            set -e
            "${build[@]}" build-for-testing 2>&1 | tee "$RUNNER_TEMP/career-iphone-local-files-build.log"
            product="$RUNNER_TEMP/career-ui-derived/Build/Products/Debug-iphonesimulator/Career Finder.app"
            # Stage files in a separate provider folder. The app under test
            # retains its normal Info.plist and reads across the Files boundary.
            fixture="$RUNNER_TEMP/Career Finder PDFs.app"
            ditto "$product" "$fixture"
            plutil -replace CFBundleIdentifier -string com.ahmadalayed.career.test-documents "$fixture/Info.plist"
            plutil -replace CFBundleDisplayName -string 'Career Finder PDFs' "$fixture/Info.plist"
            plutil -replace CFBundleName -string 'Career Finder PDFs' "$fixture/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$fixture/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$fixture/Info.plist"
            xcrun simctl install "$CAREER_UI_DEVICE" "$fixture"
            container="$(xcrun simctl get_app_container "$CAREER_UI_DEVICE" com.ahmadalayed.career.test-documents data)"
            printf '%s\n' \
              'fccbd3962e482d8b24bea10c69ec047e0879cc55cf3c3b3222909bd89108b86a  postman/fixtures/integration-resume.pdf' \
              '149f96a4dc6ed08b2adf0ae75c9d00f8fba75fcd777ea790d9a27e622fa38a61  hosted/tests/fixtures/readable-resume.pdf' |
              shasum -a 256 -c -
            mkdir -p "$container/Documents"
            cp postman/fixtures/integration-resume.pdf "$container/Documents/CV-A.pdf"
            cp hosted/tests/fixtures/readable-resume.pdf "$container/Documents/CV-B.pdf"
          fi
          "${build[@]}" -resultBundlePath "$RUNNER_TEMP/CareerFinderUI.xcresult" \
            "${selection[@]}" "$action" 2>&1 | tee "$RUNNER_TEMP/career-iphone-ui.log"
      - name: Verify every selected regression ran once
        if: ${{ env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-connection' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-regressions' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-saved-actions' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-search-history' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-arabic-profile' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-local-files' }}
        shell: python
        run: |
          import os, pathlib, re
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'career-iphone-ui.log').read_text()
          observed = re.findall(r"Test Case '-\[CareerFinderUITests\.(\w+) (test\w+)\]' (passed|failed) \(", log)
          expected = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'career-expected-ui-cases').read_text().splitlines()
          assert sorted((f'{cls}/{method}', status) for cls, method, status in observed) == sorted((case, 'passed') for case in expected), observed
          print(f'{len(expected)} selected iPhone regression cases passed.')
      - name: Retain bounded DEBUG browser lifecycle diagnostics
        if: ${{ always() && env.CAREER_UI_DEVICE != '' }}
        shell: bash
        timeout-minutes: 1
        run: |
          python3 apple/Checks/collect-browser-lifecycle.py \
            --selection "$RUNNER_TEMP/career-iphone-selection.json" \
            --device "$CAREER_UI_DEVICE" \
            --output "$RUNNER_TEMP/career-browser-lifecycle"
      - name: Retain bounded DEBUG focus lifecycle diagnostics
        if: ${{ always() && env.CAREER_UI_DEVICE != '' }}
        shell: bash
        timeout-minutes: 1
        run: |
          python3 apple/Checks/collect-browser-lifecycle.py \
            --kind focus \
            --selection "$RUNNER_TEMP/career-iphone-selection.json" \
            --device "$CAREER_UI_DEVICE" \
            --output "$RUNNER_TEMP/career-focus-lifecycle"
      - name: Export native interface evidence
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/CareerFinderUI.xcresult" ] && [ ! -f "$RUNNER_TEMP/career-ui-screenshots/manifest.json" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/CareerFinderUI.xcresult" \
              --output-path "$RUNNER_TEMP/career-ui-screenshots"
          fi
      - name: Keep the native UI results and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-connection' && 'PARTIAL-iphone-connection-regression' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-regressions' && 'PARTIAL-iphone-history-keyboard' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-saved-actions' && 'PARTIAL-iphone-saved-actions' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-search-history' && 'PARTIAL-iphone-search-history' || env.CAREER_UI_ACCEPTANCE_SCOPE == 'iphone-arabic-profile' && 'PARTIAL-iphone-arabic-profile' || startsWith(env.CAREER_UI_ACCEPTANCE_SCOPE, 'iphone-documents-') && env.CAREER_UI_ACCEPTANCE_SCOPE || 'iphone-ui-acceptance' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/career-iphone-selection.json
            ${{ runner.temp }}/career-iphone-input-configuration.json
            ${{ runner.temp }}/career-iphone-boot.log
            ${{ runner.temp }}/career-iphone-boot-devices.json
            ${{ runner.temp }}/career-iphone-boot-devices.stderr
            ${{ runner.temp }}/career-iphone-boot-verification.json
            ${{ runner.temp }}/career-iphone-ui.log
            ${{ runner.temp }}/career-iphone-local-files-build.log
            ${{ runner.temp }}/career-document-journey.json
            ${{ runner.temp }}/career-browser-lifecycle
            ${{ runner.temp }}/career-focus-lifecycle
            ${{ runner.temp }}/CareerFinderUI.xcresult
            ${{ runner.temp }}/career-ui-screenshots
          if-no-files-found: ignore
          retention-days: 7
